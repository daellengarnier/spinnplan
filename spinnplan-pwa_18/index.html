<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spinnplan">
<meta name="theme-color" content="#000000">
<meta name="description" content="Spinnplan – Schichtplanung der Kulturspinnerei Bern">
<title>Spinnplan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100vw;overflow-x:hidden;}body{font-family:'Barlow',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;
  --border:#2a2a2a;--border2:#383838;--text:#f0f0f0;--muted:#666;--dim:#999;
  --green:#6fcf7a;--green-bg:#1a2e1c;--green-border:#2d5a32;
  --blue:#7a9fe8;--blue-bg:#1a2040;--blue-border:#2d4080;
  --red:#e63329;--admin:#4a7fbf;--gold:#c9a84c;
  --mono:'Share Tech Mono',monospace;--cond:'VT323',monospace;
}
input,button,select,textarea{font-family:'VT323',monospace;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#111;}
::-webkit-scrollbar-thumb{background:#333;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#000;}
.auth-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border2);padding:36px;}
.auth-eyebrow{font-family:var(--mono);font-size:0.54rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.auth-title{font-family:var(--cond);font-size:1.8rem;font-weight:800;text-transform:uppercase;margin-bottom:24px;}
.auth-tabs{display:flex;margin-bottom:24px;border:1px solid var(--border2);}
.auth-tab{flex:1;font-family:var(--mono);font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;padding:10px;background:transparent;color:var(--muted);border:none;cursor:pointer;transition:all .15s;}
.auth-tab.active{background:var(--text);color:#000;}
.field{margin-bottom:14px;}
.field label{font-family:var(--mono);font-size:0.52rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;}
.field input{width:100%;font-size:0.92rem;padding:10px 12px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--text);}
.btn-full{width:100%;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;padding:12px;border:none;cursor:pointer;transition:all .15s;margin-top:4px;}
.btn-full.primary{background:var(--text);color:#000;}
.btn-full.primary:hover{background:#ddd;}
.btn-full:disabled{opacity:0.5;cursor:not-allowed;}
.auth-err{font-family:var(--mono);font-size:0.85rem;color:var(--red);margin-top:10px;text-align:center;line-height:1.5;}
.auth-ok{font-family:var(--mono);font-size:0.85rem;color:var(--green);margin-top:10px;text-align:center;line-height:1.5;}

/* LOADING */
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:16px;}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--mono);font-size:0.88rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);}

/* HEADER */
.header{height:calc(76px + env(safe-area-inset-top));background:#000;border-bottom:none;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 20px 0;position:sticky;top:0;z-index:100;width:100%;box-sizing:border-box;}
.header-left{display:flex;align-items:center;gap:16px;}
.h-div{display:none;}
.h-sub{font-family:var(--mono);font-size:0.82rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);}
.header-right{display:flex;align-items:center;gap:10px;}
.h-user{display:flex;align-items:center;gap:10px;}
.h-name{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.08em;color:var(--dim);}
.h-badge{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--admin);color:var(--admin);}
.h-btn{font-family:var(--mono);font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--border2);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;}
.h-btn:hover{border-color:var(--text);color:var(--text);}

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:0;overflow-x:auto;width:100%;box-sizing:border-box;margin-top:18px;}
.nav::-webkit-scrollbar{height:0;}
.nav-tab{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;padding:11px 20px;background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.nav-tab.active{color:var(--text);border-bottom-color:var(--text);}
.nav-tab:hover:not(.active){color:var(--dim);}
.nav-badge{display:inline-block;font-size:0.5rem;background:var(--red);color:#fff;border-radius:99px;padding:1px 5px;margin-left:5px;vertical-align:middle;}

/* MAIN */
.main{max-width:1080px;margin:0 auto;padding:32px 20px 80px;}
.page-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.page-eyebrow{font-family:var(--mono);font-size:0.54rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.page-title{font-family:var(--cond);font-size:2rem;font-weight:900;text-transform:uppercase;line-height:1;}

/* BUTTONS */
.btn{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--border2);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;}
.btn:hover{border-color:var(--text);color:var(--text);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.white{border-color:var(--text);color:var(--text);}
.btn.white:hover{background:var(--text);color:#000;}
.btn.red{border-color:var(--red);color:var(--red);}
.btn.red:hover{background:var(--red);color:#fff;}
.btn.green{border-color:var(--green-border);color:var(--green);}
.btn.green:hover{background:var(--green-bg);}
.btn.sm{padding:5px 10px;font-size:0.54rem;}

/* REALTIME INDICATOR */
.rt-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* EVENTS GRID */
.events-grid{display:grid;gap:2px;}
.event-card{background:var(--surface);border:1px solid var(--border);animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ev-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;user-select:none;transition:background .15s;border-bottom:1px solid transparent;}
.ev-header:hover{background:var(--surface2);}
.ev-header.open{background:#000;border-bottom-color:var(--border);}
.ev-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
.ev-name-wrap{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
.ev-progress-row{display:flex;align-items:center;gap:8px;}
.ev-date-box{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 8px;border:1px solid var(--border2);text-align:center;flex-shrink:0;}
.ev-day{font-family:var(--cond);font-size:2.2rem;font-weight:800;line-height:1;}
.ev-mon{font-family:var(--mono);font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.ev-name{font-family:var(--cond);font-size:1.5rem;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;overflow:hidden;white-space:normal;word-break:break-word;}
.ev-right{display:none;}
.ev-fill-pill{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.06em;padding:3px 8px;border:1px solid var(--border2);color:var(--muted);}
.ev-fill-pill.warn{border-color:#7a4a20;color:#c9844c;}
.ev-fill-pill.ok{border-color:var(--green-border);color:var(--green);}
.ev-prog{width:60px;height:2px;background:var(--border);flex-shrink:0;}
.ev-prog-fill{height:100%;background:var(--text);transition:width .4s;}
.ev-chevron{font-size:0.56rem;color:var(--muted);transition:transform .25s;flex-shrink:0;}
.ev-header.open .ev-chevron{transform:rotate(180deg);}
.ev-body{display:none;flex-direction:column;gap:22px;padding:20px;background:#0d0d0d;}
.ev-body.open{display:flex;}
.sec-label{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* RESPONSIBILITIES */
.resp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;}
.resp-item{display:flex;flex-direction:column;gap:3px;}
.resp-lbl{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.resp-val{font-size:0.82rem;font-weight:500;padding:6px 9px;background:var(--surface2);border:1px solid var(--border);min-height:30px;display:flex;align-items:center;}
.resp-val.empty{color:var(--muted);font-style:italic;font-size:0.72rem;}
.resp-input{font-size:0.82rem;padding:5px 9px;background:var(--surface2);border:1px solid var(--admin);color:var(--text);width:100%;outline:none;min-height:30px;}

/* SHIFTS TABLE */
.shifts-table-wrap{overflow-x:auto;display:block;}
.shifts-tbl{width:100%;border-collapse:collapse;min-width:420px;}
.shifts-tbl th{font-family:var(--mono);font-size:0.54rem;letter-spacing:0.08em;text-transform:uppercase;padding:8px 12px;background:#000;color:var(--dim);text-align:center;border:1px solid var(--border);white-space:nowrap;}
.shifts-tbl th.rc{text-align:left;min-width:100px;}
.shifts-tbl td{border:1px solid var(--border);padding:0;vertical-align:middle;}
.shifts-tbl td.rn{font-family:var(--mono);font-size:0.54rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px;background:var(--surface);white-space:nowrap;}

/* SHIFTS MOBILE */
.shifts-mobile{display:none;flex-direction:column;gap:10px;}
.shift-block-card{background:var(--surface2);border:1px solid var(--border);}
.shift-block-header{font-family:var(--mono);font-size:0.88rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);padding:8px 12px;border-bottom:1px solid var(--border);background:#000;}
.shift-row-mobile{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);}
.shift-row-mobile:last-child{border-bottom:none;}
.shift-role-lbl{font-family:var(--mono);font-size:0.54rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);min-width:80px;}
.shift-slot-mob{flex:1;display:flex;align-items:center;justify-content:flex-end;}

/* SLOT */
.slot{position:relative;min-height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s;padding:6px;}
.slot.empty{background:#0d0d0d;}
.slot.empty:hover{background:#1c1c1c;}
.slot.filled{background:var(--green-bg);border-left:2px solid var(--green-border);}
.slot.mine{background:var(--blue-bg);border-left:2px solid var(--blue-border);}
.slot.unavail{background:var(--surface);cursor:default;}
.slot.saving{opacity:.5;pointer-events:none;}
.slot-name{font-size:0.8rem;font-weight:500;color:var(--green);text-align:center;}
.slot-name.is-mine{color:var(--blue);}
.slot-hint{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.08em;color:var(--border2);text-transform:uppercase;}
.slot.empty:hover .slot-hint{color:var(--muted);}
.slot-dash{color:var(--border2);}
.slot-x{position:absolute;top:2px;right:2px;font-size:0.46rem;color:var(--green);opacity:0;background:rgba(0,0,0,.5);border:none;width:12px;height:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s;}
.slot:hover .slot-x{opacity:.8;}
.slot-mob{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:0.8rem;font-weight:500;cursor:pointer;border:1px solid var(--border2);min-width:110px;justify-content:center;}
.slot-mob.empty{color:var(--muted);background:var(--surface);}
.slot-mob.empty:hover{border-color:var(--text);color:var(--text);}
.slot-mob.filled{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.slot-mob.mine{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue);}
.slot-mob.unavail{color:var(--border2);background:var(--surface);cursor:default;border-color:var(--border);}

/* ADMIN PANEL */
.admin-panel{background:var(--surface);border:1px solid var(--border);padding:28px;}
.panel-title{font-family:var(--cond);font-size:1.3rem;font-weight:800;text-transform:uppercase;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-label{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.f-input{font-size:0.88rem;padding:8px 11px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;}
.f-input:focus{border-color:var(--text);}
.sec-div{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin:20px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.dur-pills{display:flex;gap:5px;flex-wrap:wrap;}
.dur-pill{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.08em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
.dur-pill:hover{border-color:var(--dim);color:var(--dim);}
.dur-pill.active{border-color:var(--text);color:var(--text);background:rgba(255,255,255,.04);}
.tpl-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tpl-pill{font-family:var(--mono);font-size:0.82rem;letter-spacing:0.06em;padding:6px 14px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;}
.tpl-pill:hover{border-color:var(--gold);color:var(--gold);}
.roles-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;}
@keyframes spin-slow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.logo-spin{animation:spin-slow 20s linear infinite;border-radius:50%;border:2px solid #000;padding:3px;}
.h-menu-btn{background:transparent;border:1px solid var(--border2);color:#fff;padding:6px 11px;cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;}
.h-notif-btn{position:relative;background:transparent;border:1px solid var(--border2);color:#fff;padding:6px 11px;cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;margin-right:6px;}
.h-notif-badge{position:absolute;top:-6px;right:-6px;background:#ff4444;color:#fff;font-family:var(--mono);font-size:0.45rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.h-menu-icon{font-size:1.1rem;line-height:1;}
.h-dropdown{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);}
.h-dropdown-inner{position:absolute;top:calc(76px + env(safe-area-inset-top));right:12px;background:#111;border:1px solid var(--border2);min-width:200px;padding:8px 0;}
.h-dropdown-name{font-family:var(--mono);font-size:0.88rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg);padding:10px 18px 4px;}
.h-dropdown-role{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);padding:0 18px 10px;}
.h-dropdown-divider{height:1px;background:var(--border);margin:4px 0;}
.h-dropdown-item{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--dim);font-family:var(--mono);font-size:0.85rem;letter-spacing:0.08em;text-transform:uppercase;padding:11px 18px;cursor:pointer;transition:all .15s;}
.h-dropdown-item:hover{background:var(--surface2);color:var(--fg);}
.h-dropdown-item.red{color:var(--red);}
.h-dropdown-item.red:hover{background:rgba(255,68,68,0.08);}
.role-check-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;user-select:none;min-height:44px;}
.role-check-item:hover{border-color:var(--border2);}
.role-check-item.checked{border-color:var(--text);background:rgba(255,255,255,.03);}
.role-check-box{width:13px;height:13px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:0.48rem;flex-shrink:0;transition:all .15s;}
.role-check-item.checked .role-check-box{border-color:var(--text);color:var(--text);}
.role-check-name{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);}
.role-check-item.checked .role-check-name{color:var(--text);}
.role-count-wrap{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0;}
.role-count-btn{width:18px;height:18px;border:1px solid var(--border2);background:transparent;color:var(--dim);cursor:pointer;font-size:0.75rem;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;transition:all .15s;}
.role-count-btn:hover{border-color:var(--text);color:var(--text);}
.role-count-num{font-family:var(--mono);font-size:0.62rem;color:var(--text);min-width:12px;text-align:center;}
.shift-preview{background:var(--surface2);border:1px solid var(--border);padding:14px;margin-top:4px;}
.preview-label{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.preview-blocks{display:flex;gap:5px;flex-wrap:wrap;}
.preview-block{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.05em;color:var(--dim);padding:4px 10px;border:1px solid var(--border2);}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.ev-admin-actions{display:flex;gap:6px;padding:6px 0;justify-content:flex-end;}

/* MY SHIFTS */
.my-shifts-list{display:flex;flex-direction:column;gap:10px;}
.my-shift-card{background:var(--surface);border:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.my-shift-group{background:var(--surface);border:1px solid var(--border);overflow:hidden;}
.my-shift-group-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;}
.my-shift-group-date{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);flex-shrink:0;}
.my-shift-group-name{font-family:var(--cond);font-size:1.2rem;font-weight:700;text-transform:uppercase;color:var(--fg);}
.my-shift-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px;}
.my-shift-row:last-child{border-bottom:none;}

// ── HELPERS ──
function toMins(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function fromMins(m){const t=((m%1440)+1440)%1440;return`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;}
function isEventPast(ev){
  const blocks=computeBlocks(ev.startTime||ev.start_time,ev.durHours||ev.dur_hours,ev.numBlocks||ev.num_blocks);
  const lastEnd=blocks.length>0?blocks[blocks.length-1].split(' – ')[1]:'23:59';
  const endMins=toMins(lastEnd);const startMins=toMins(ev.startTime||ev.start_time||'00:00');
  const overnight=endMins<=startMins;
  const endDate=new Date(ev.date+'T00:00:00');
  if(overnight)endDate.setDate(endDate.getDate()+1);
  const[eh,em]=lastEnd.split(':').map(Number);
  endDate.setHours(eh,em,0,0);
  return endDate<new Date();
}
function computeBlocks(startTime,durHours,numBlocks){
  let mins=toMins(startTime);const durMins=durHours*60;const blocks=[];
  for(let i=0;i<numBlocks;i++){const s=fromMins(mins);mins+=durMins;blocks.push(`${s} – ${fromMins(mins)}`);}
  return blocks;
}
function calcNumBlocks(start,end,dur){
  let s=toMins(start),e=toMins(end);if(e<=s)e+=1440;
  return Math.max(1,Math.round((e-s)/(dur*60)));
}
function getRoleDur(ev,roleKey){return(ev.roleDurHours&&ev.roleDurHours[roleKey])||ev.durHours;}
function getRoleStart(ev,roleKey){return(ev.roleStartTimes&&ev.roleStartTimes[roleKey])||ev.startTime;}
function getRoleEnd(ev,roleKey){return(ev.roleEndTimes&&ev.roleEndTimes[roleKey])||ev.endTime;}
function getRoleBlockCount(ev,roleKey){
  const dur=getRoleDur(ev,roleKey);
  const start=getRoleStart(ev,roleKey);
  const end=getRoleEnd(ev,roleKey);
  const defaultNb=end?calcNumBlocks(start,end,dur):ev.numBlocks;
  return(ev.roleBlocks&&ev.roleBlocks[roleKey]!=null)?ev.roleBlocks[roleKey]:defaultNb;
}
function getRoleBlocks(ev,roleKey){return computeBlocks(getRoleStart(ev,roleKey),getRoleDur(ev,roleKey),getRoleBlockCount(ev,roleKey));}
function buildSlots(ev){
  const slots={};
  getEventRoles(ev).forEach(st=>{
    if(!ev.enabledRoles[st.key])return;
    const cnt=ev.roleCounts[st.key]||st.defaultCount;
    const blocks=getRoleBlocks(ev,st.key);
    blocks.forEach((_,bi)=>{slots[`${st.key}_${bi}`]=Array(cnt).fill('');});
  });
  return slots;
}
function countSlots(ev){
  let n=0;
  getEventRoles(ev).forEach(st=>{
    if(!ev.enabledRoles[st.key])return;
    const cnt=ev.roleCounts[st.key]||st.defaultCount;
    const blocks=getRoleBlocks(ev,st.key);
    for(let bi=0;bi<blocks.length;bi++){for(let si=0;si<cnt;si++)n++;}
  });
  return n;
}
function countFilled(ev){
  let n=0;
  getEventRoles(ev).forEach(st=>{
    if(!ev.enabledRoles[st.key])return;
    const cnt=ev.roleCounts[st.key]||st.defaultCount;
    const blocks=getRoleBlocks(ev,st.key);
    for(let bi=0;bi<blocks.length;bi++){
      const key=`${st.key}_${bi}`;
      const arr=ev.slots[key]||[];
      for(let si=0;si<cnt;si++){if(arr[si]&&arr[si].trim()!=='')n++;}
    }
  });
  return n;
}
function fmtDate(d){
  if(!d)return{day:'',mon:'',full:''};
  const dt=new Date(d+'T12:00');
  return{day:dt.getDate(),mon:dt.toLocaleDateString('de-CH',{month:'short'}).toUpperCase().replace('.',''),full:dt.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'})};
}
function findMyShifts(events,userName){
  const shifts=[];
  events.forEach(ev=>{
    getEventRoles(ev).forEach(st=>{
      if(!ev.enabledRoles[st.key])return;
      const cnt=ev.roleCounts[st.key]||st.defaultCount;
      const blocks=getRoleBlocks(ev,st.key);
      blocks.forEach((block,bi)=>{
        const key=`${st.key}_${bi}`;
        (ev.slots[key]||[]).forEach((v,si)=>{

        });
      });
    });
  });
  return shifts.sort((a,b)=>a.date.localeCompare(b.date));
}

function dbToEvent(row, slots_rows){
  const slots={};
  (slots_rows||[]).forEach(s=>{

    fixedRoles:row.fixed_roles||Object.fromEntries(FIXED_ROLES.map(r=>[r,''])),
    customRoles:row.custom_roles||[],
    roleLabels:row.role_labels||{},

  };
}

// ── HAUSFEST GROUPED VIEW ──
const HAUSFEST_ROLES=['BarSpinnerei','BarOstblock','CocktailDreiecksbar','BarGarten','SnackbarKleemex'];
const ROLE_GROUPS=[
  {key:'einlass',label:'Einlass',icon:'🚪',roles:['Einlass','EinlassGarten']},
  {key:'sicherheit',label:'Sicherheit',icon:'🛡️',roles:['Sicherheit']},
  {key:'bars',label:'Bars',icon:'🍺',roles:['Bar','BarSpinnerei','BarOstblock','CocktailDreiecksbar','BarGarten']},
  {key:'snacks',label:'Snackbar',icon:'🍕',roles:['SnackbarKleemex']},
  {key:'andere',label:'Weitere',icon:'⚡',roles:['Garderobe','Springer']},

function HausfestShifts({ev,currentUser,saving,openModal,handleRemove}){
  const[openGroup,setOpenGroup]=useState(null);
  const activeRoles=getEventRoles(ev).filter(st=>ev.enabledRoles[st.key]);
  const activeGroups=ROLE_GROUPS.map(g=>{
    const roles=g.roles.map(k=>activeRoles.find(st=>st.key===k)).filter(Boolean)
      .sort((a,b)=>toMins(getRoleStart(ev,a.key))-toMins(getRoleStart(ev,b.key)));
    if(roles.length===0)return null;
    let total=0,filled=0;
    roles.forEach(st=>{
      const cnt=ev.roleCounts[st.key]||st.defaultCount;
      const blks=getRoleBlocks(ev,st.key);
      blks.forEach((_,bi)=>{const arr=ev.slots[`${st.key}_${bi}`]||[];
        for(let si=0;si<cnt;si++){total++;if(arr[si]&&arr[si].trim())filled++;}});
    });
    return{...g,roles,total,filled,open:total-filled};
  }).filter(Boolean);
  const groupedKeys=new Set(ROLE_GROUPS.flatMap(g=>g.roles));
  const ungrouped=activeRoles.filter(st=>!groupedKeys.has(st.key));
  if(ungrouped.length>0){
    let total=0,filled=0;
    ungrouped.forEach(st=>{
      const cnt=ev.roleCounts[st.key]||st.defaultCount;
      const blks=getRoleBlocks(ev,st.key);
      blks.forEach((_,bi)=>{const arr=ev.slots[`${st.key}_${bi}`]||[];
        for(let si=0;si<cnt;si++){total++;if(arr[si]&&arr[si].trim())filled++;}});
    });
    activeGroups.push({key:'custom',label:'Weitere',icon:'⚡',roles:ungrouped,total,filled,open:total-filled});
  }

  return(
    <div style={{display:'flex',flexDirection:'column',gap:2}}>
      {activeGroups.map(g=>(
        <div key={g.key} style={{border:'1px solid var(--border)',overflow:'hidden'}}>
          <button onClick={()=>setOpenGroup(openGroup===g.key?null:g.key)} style={{width:'100%',background:openGroup===g.key?'#1a1a1a':'var(--surface)',border:'none',padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',gap:10}}>
            <span style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:'1.1rem'}}>{g.icon}</span>
              <span style={{fontFamily:'var(--cond)',fontSize:'1.1rem',fontWeight:700,textTransform:'uppercase',color:'#fff',letterSpacing:'0.06em'}}>{g.roles.length===1?getRoleLabel(ev,g.roles[0]):g.label}</span>
              {g.roles.length>1&&<span style={{fontFamily:'var(--mono)',fontSize:'0.48rem',color:'var(--muted)'}}>({g.roles.length})</span>}
            </span>
            <span style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontFamily:'var(--mono)',fontSize:'0.52rem',letterSpacing:'0.06em',padding:'3px 8px',border:'1px solid',borderColor:g.open===0?'var(--green-border)':'#7a4a20',color:g.open===0?'var(--green)':'#c9a84c'}}>{g.open===0?'✓ Voll':`${g.open} offen`}</span>
              <span style={{fontFamily:'var(--mono)',fontSize:'0.6rem',color:'var(--muted)',transition:'transform 0.2s',display:'inline-block',transform:openGroup===g.key?'rotate(180deg)':'rotate(0deg)'}}>▼</span>
            </span>
          </button>
          {openGroup===g.key&&<div style={{borderTop:'1px solid var(--border)',background:'#0d0d0d'}}>
            {g.roles.map(st=>{
              const blks=getRoleBlocks(ev,st.key);
              const cnt=ev.roleCounts[st.key]||st.defaultCount;
              return(
                <div key={st.key} style={{borderBottom:'1px solid var(--border)'}}>
                  {g.roles.length>1&&<div style={{fontFamily:'var(--mono)',fontSize:'0.54rem',letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--gold)',padding:'10px 14px 4px',fontWeight:700}}>{getRoleLabel(ev,st)}</div>}
                  {blks.map((block,bi)=>{
                    const key=`${st.key}_${bi}`;
                    const arr=ev.slots[key]||[];
                    return(
                      <div key={bi} style={{padding:'0 14px'}}>
                        <div style={{fontFamily:'var(--mono)',fontSize:'0.5rem',color:'var(--muted)',padding:'8px 0 4px',letterSpacing:'0.08em'}}>{block}</div>
                        <div style={{display:'flex',gap:6,paddingBottom:8,flexWrap:'wrap'}}>
                          {Array.from({length:cnt},(_,si)=>{
                            const val=arr[si]??null;
                            const isMe=val&&currentUser&&val===currentUser.name;
                            if(val)return<span key={si} className={`slot-mob ${isMe?'mine':'filled'}`} onClick={isMe||currentUser?.isAdmin?()=>handleRemove(key,si):undefined} style={{minWidth:0,flex:'1 1 auto',justifyContent:'center'}}>{val}{(isMe||currentUser?.isAdmin)&&<span style={{fontSize:'0.6rem',opacity:.6,marginLeft:4}}>✕</span>}</span>;
                            return<span key={si} className="slot-mob empty" onClick={()=>openModal(ev.id,key,si,getRoleLabel(ev,st),block)} style={{minWidth:0,flex:'1 1 auto',justifyContent:'center'}}>+ Eintragen</span>;
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>}
        </div>
      ))}
    </div>
  );
}

// ── EVENT CARD ──
function EventCard({ev,currentUser,isAdmin,onSlotChange,openModal,defaultOpen}){
  const[open,setOpen]=useState(defaultOpen||false);
  const[saving,setSaving]=useState(null);
  const blocks=computeBlocks(ev.startTime,ev.durHours,ev.numBlocks);
  const{day,mon}=fmtDate(ev.date);
  const total=countSlots(ev),filled=countFilled(ev);
  const pct=total>0?Math.round(filled/total*100):0;
  const openSlots=total-filled;
  const activeRoles=getEventRoles(ev).filter(st=>ev.enabledRoles[st.key]);
  const isHausfest=HAUSFEST_ROLES.some(k=>ev.enabledRoles[k]);

  async function handleSignup(key,si){
    if(!currentUser)return;
    setSaving(`${key}_${si}`);
    await onSlotChange(ev.id,key,si,currentUser.name,currentUser.id);
    setSaving(null);
  }
  async function handleRemove(key,si){
    if(!window.confirm('Eintrag löschen?'))return;
    setSaving(`${key}_${si}`);
    await onSlotChange(ev.id,key,si,'',null);
    setSaving(null);
  }
  async function updateFixedRole(role,val){
    const newFixed={...ev.fixedRoles,[role]:val};
    await sb.from('events').update({fixed_roles:newFixed}).eq('id',ev.id);
  }

  const pillClass=openSlots===0?'ok':openSlots<=3?'warn':'';
  return(
    <div className="event-card">
      <div className={`ev-header${open?' open':''}`} onClick={()=>setOpen(!open)}>
        <div className="ev-left">
          <div className="ev-date-box"><div className="ev-day">{day}</div><div className="ev-mon">{mon}</div></div>
          <div className="ev-name-wrap">
            <span className="ev-name">{ev.name}</span>
            <div className="ev-progress-row">
              <span className={`ev-fill-pill ${pillClass}`}>{openSlots===0?'✓ Voll':`${openSlots} offen`}</span>
              <div className="ev-prog"><div className="ev-prog-fill" style={{width:pct+'%'}}></div></div>
            </div>
          </div>
        </div>
        <span className="ev-chevron">▼</span>
      </div>
      {open&&<div className="ev-body open">
        <div>
          <div className="sec-label">Verantwortlichkeiten</div>
          <div className="resp-grid">
            {FIXED_ROLES.map(role=>{
              const val=ev.fixedRoles[role]||'';
              if(isAdmin)return(
                <div key={role} className="resp-item">
                  <span className="resp-lbl">{role}</span>
                  <input className="resp-input" defaultValue={val} placeholder="—" onBlur={e=>updateFixedRole(role,e.target.value)}/>
                </div>
              );
              return(
                <div key={role} className="resp-item">
                  <span className="resp-lbl">{role}</span>
                  <div className={`resp-val${val?'':' empty'}`}>{val||'Offen'}</div>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <div className="sec-label">
            <span className="rt-dot"></span>Schichten (Echtzeit)
          </div>
          {isHausfest
            ?<HausfestShifts ev={ev} currentUser={currentUser} saving={saving} openModal={openModal} handleRemove={handleRemove}/>
            :<><div className="shifts-table-wrap">
            {(()=>{
              const groups=[];const seen={};
              activeRoles.forEach(st=>{
                const blks=getRoleBlocks(ev,st.key);
                const gk=blks.join('|');
                if(!seen[gk]){seen[gk]={blocks:blks,roles:[]};groups.push(seen[gk]);}
                seen[gk].roles.push(st);
              });
              return groups.map((g,gi)=>(
                <table key={gi} className="shifts-tbl" style={gi>0?{marginTop:12}:{}}>
                  <thead><tr>
                    <th className="rc">Schicht</th>
                    {g.blocks.map((b,i)=><th key={i}>{b}</th>)}
                  </tr></thead>
                  <tbody>
                    {g.roles.map(st=>{
                      const cnt=ev.roleCounts[st.key]||st.defaultCount;
                      return Array.from({length:cnt},(_,si)=>(
                        <tr key={`${st.key}-${si}`}>
                          <td className="rn">{getRoleLabel(ev,st)}</td>
                          {g.blocks.map((_,bi)=>{
                            const key=`${st.key}_${bi}`;
                            const arr=ev.slots[key]||[];
                            const isSaving=saving===`${key}_${si}`;
                            return<SlotCell key={bi} val={arr[si]??null} currentUser={currentUser} saving={isSaving}
                              onSignup={()=>openModal(ev.id,key,si,getRoleLabel(ev,st),g.blocks[bi])}
                              onRemove={()=>handleRemove(key,si)}/>;
                          })}
                        </tr>
                      ));
                    })}
                  </tbody>
                </table>
              ));
            })()}
          </div>
          <div className="shifts-mobile">
            {activeRoles.map(st=>{
              const blks=getRoleBlocks(ev,st.key);
              const cnt=ev.roleCounts[st.key]||st.defaultCount;
              return blks.map((block,bi)=>(
                <div key={`${st.key}-${bi}`} className="shift-block-card">
                  <div className="shift-block-header">{getRoleLabel(ev,st)} · {block}</div>
                  {Array.from({length:cnt},(_,si)=>{
                    const key=`${st.key}_${bi}`;
                    const arr=ev.slots[key]||[];
                    return(
                      <div key={si} className="shift-row-mobile">
                        <span className="shift-role-lbl">Platz {si+1}</span>
                        <div className="shift-slot-mob">
                          <SlotMob val={arr[si]??null} currentUser={currentUser}
                            onSignup={()=>openModal(ev.id,key,si,getRoleLabel(ev,st),block)}
                            onRemove={()=>handleRemove(key,si)}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ));
            })}
          </div></>}
        </div>
      </div>}
    </div>
  );
}

// ── ADMIN CREATE EVENT ──
function AdminCreateEvent({onSave,onCancel,existing}){
  const[name,setName]=useState(existing?.name||'');
  const[date,setDate]=useState(existing?.date||'');
  const[startTime,setStartTimeS]=useState(existing?.startTime||'21:00');
  const[endTime,setEndTimeS]=useState(existing?.endTime||'00:30');
  const[durHours,setDurHoursS]=useState(existing?.durHours||1.5);
  const[numBlocks,setNumBlocks]=useState(existing?.numBlocks||2);
  const[enabledRoles,setEnabledRoles]=useState(existing?.enabledRoles||{Einlass:true,Bar:true,Sicherheit:false,Garderobe:false,Springer:true});
  const[roleCounts,setRoleCounts]=useState(existing?.roleCounts||{Einlass:2,Bar:2,Sicherheit:2,Garderobe:1,Springer:1});
  // Per-role block counts (0 = use global numBlocks)
  const[roleBlocks,setRoleBlocks]=useState(existing?.roleBlocks||{});
  const[roleDurHours,setRoleDurHours]=useState(existing?.roleDurHours||{});
  const[roleStartTimes,setRoleStartTimes]=useState(existing?.roleStartTimes||{});
  const[roleEndTimes,setRoleEndTimes]=useState(existing?.roleEndTimes||{});
  const[customRoles,setCustomRoles]=useState(existing?.customRoles||[]);
  const[roleLabels,setRoleLabels]=useState(existing?.roleLabels||{});
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState('');

  function recalc(s,e,d){setNumBlocks(calcNumBlocks(s,e,d));}
  function handleStart(v){setStartTimeS(v);if(endTime)recalc(v,endTime,durHours);}
  function handleEnd(v){setEndTimeS(v);if(startTime)recalc(startTime,v,durHours);}
  function handleDur(v){setDurHoursS(v);if(startTime&&endTime)recalc(startTime,endTime,v);}
  function applyTpl(t){setStartTimeS(t.startTime);setEndTimeS(t.endTime);setDurHoursS(t.durHours);setEnabledRoles(t.enabledRoles);setRoleCounts(t.roleCounts);setRoleDurHours(t.roleDurHours||{});setRoleStartTimes(t.roleStartTimes||{});setRoleEndTimes(t.roleEndTimes||{});setCustomRoles(t.customRoles||[]);setRoleLabels(t.roleLabels||{});recalc(t.startTime,t.endTime,t.durHours);}
  function toggleRole(k){setEnabledRoles(r=>({...r,[k]:!r[k]}));}
  function changeCount(k,d){setRoleCounts(r=>({...r,[k]:Math.max(1,Math.min(4,(r[k]||1)+d))}));}
  function changeRoleBlocks(k,d){setRoleBlocks(r=>({...r,[k]:Math.max(0,Math.min(numBlocks,(r[k]||numBlocks)+d))}));}

  const blocks=computeBlocks(startTime,durHours,numBlocks);
  const computedEnd=blocks.length>0?blocks[blocks.length-1].split(' – ')[1]:'';
  const isHausfestForm=HAUSFEST_ROLES.some(k=>enabledRoles[k]);

  async function doSave(){
    if(!name.trim()||!date){setErr('Name und Datum sind erforderlich.');return;}
    setSaving(true);setErr('');
    const ev={id:existing?.id,name:name.trim(),date,startTime,endTime,durHours,numBlocks,enabledRoles,roleCounts,roleBlocks,roleDurHours,roleStartTimes,roleEndTimes,customRoles,roleLabels,
      fixedRoles:existing?.fixedRoles||Object.fromEntries(FIXED_ROLES.map(r=>[r,''])),slots:{}};
    await onSave(ev);
    setSaving(false);
  }

  return(
    <div className="admin-panel">
      <div className="panel-title">{existing?'Anlasse bearbeiten':'Neuer Anlass'}</div>
      <div className="sec-div" style={{marginTop:0}}>Vorlage</div>
      <div className="tpl-pills">
        {TEMPLATES.map(t=>(
          <button key={t.label} className="tpl-pill" onClick={()=>applyTpl(t)}>
            <span>{t.icon}</span>{t.label}
            <span style={{color:'var(--muted)',fontSize:'0.5rem'}}>{t.startTime}–{t.endTime}</span>
          </button>
        ))}
      </div>
      <div className="sec-div">Grundinfos</div>
      <div className="form-grid">
        <div className="f-group"><label className="f-label">Name</label><input className="f-input" value={name} onChange={e=>setName(e.target.value)} placeholder="z.B. Dagobert"/></div>
        <div className="f-group"><label className="f-label">Datum</label><input className="f-input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      </div>
      <div className="sec-div">Zeiten</div>
      <div className="form-grid">
        <div className="f-group"><label className="f-label">Startzeit</label><input className="f-input" type="time" value={startTime} onChange={e=>handleStart(e.target.value)}/></div>
        <div className="f-group"><label className="f-label">Endzeit</label><input className="f-input" type="time" value={endTime} onChange={e=>handleEnd(e.target.value)}/></div>
      </div>
      {!isHausfestForm&&<><div className="form-grid" style={{marginBottom:8}}>
        <div className="f-group">
          <label className="f-label">Schichtdauer</label>
          <div className="dur-pills">{DUR_OPTIONS.map(d=><button key={d.hours} className={`dur-pill${durHours===d.hours?' active':''}`} onClick={()=>handleDur(d.hours)}>{d.label}</button>)}</div>
        </div>
        <div className="f-group">
          <label className="f-label">Berechnete Endzeit</label>
          <div style={{fontFamily:'var(--mono)',fontSize:'0.72rem',padding:'8px 11px',border:'1px solid var(--border)',color:computedEnd?'var(--green)':'var(--muted)',background:'var(--surface2)',letterSpacing:'0.08em'}}>{computedEnd||'—'}</div>
        </div>
      </div>
      <div className="shift-preview">
        <div className="preview-label">Vorschau</div>
        <div className="preview-blocks">{blocks.map((b,i)=><span key={i} className="preview-block">{b}</span>)}</div>
      </div></>}
      <div className="sec-div">Schicht-Rollen</div>
      {isHausfestForm
      ?<div style={{display:'flex',flexDirection:'column',gap:2}}>
        {[...ALL_SHIFT_TYPES].sort((a,b)=>{
          const ae=enabledRoles[a.key]?0:1,be=enabledRoles[b.key]?0:1;
          if(ae!==be)return ae-be;
          if(ae===0)return toMins(roleStartTimes[a.key]||startTime)-toMins(roleStartTimes[b.key]||startTime);
          return 0;
        }).map(st=>(
          <div key={st.key} style={{border:'1px solid',borderColor:enabledRoles[st.key]?'var(--text)':'var(--border)',background:enabledRoles[st.key]?'rgba(255,255,255,.03)':'var(--surface2)',padding:enabledRoles[st.key]?'12px 14px':'10px 14px'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}} onClick={()=>toggleRole(st.key)}>
              <div className="role-check-box" style={{width:14,height:14,border:'1.5px solid',borderColor:enabledRoles[st.key]?'var(--text)':'var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.5rem',flexShrink:0,color:'var(--text)'}}>{enabledRoles[st.key]&&'✓'}</div>
              {enabledRoles[st.key]
                ?<input value={roleLabels[st.key]||st.label} onClick={e=>e.stopPropagation()} onChange={e=>setRoleLabels(r=>({...r,[st.key]:e.target.value}))} style={{fontFamily:'var(--mono)',fontSize:'0.88rem',letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text)',flex:1,background:'transparent',border:'1px solid var(--border2)',padding:'4px 8px'}}/>
                :<span style={{fontFamily:'var(--mono)',fontSize:'0.88rem',letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--muted)',flex:1}}>{st.label}</span>}
            </div>
            {enabledRoles[st.key]&&(
              <div style={{display:'flex',flexWrap:'wrap',gap:12,marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)'}} onClick={e=>e.stopPropagation()}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:'0.5rem',color:'var(--muted)'}}>Personen</span>
                  <button className="role-count-btn" onClick={()=>changeCount(st.key,-1)}>−</button>
                  <span className="role-count-num">{roleCounts[st.key]||st.defaultCount}</span>
                  <button className="role-count-btn" onClick={()=>changeCount(st.key,+1)}>+</button>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:'0.5rem',color:'var(--muted)'}}>Dauer</span>
                  {DUR_OPTIONS.map(d=><button key={d.hours} style={{fontFamily:'var(--mono)',fontSize:'0.52rem',padding:'2px 6px',border:'1px solid',borderColor:(roleDurHours[st.key]||durHours)===d.hours?'var(--text)':'var(--border2)',background:(roleDurHours[st.key]||durHours)===d.hours?'rgba(255,255,255,.08)':'transparent',color:(roleDurHours[st.key]||durHours)===d.hours?'var(--text)':'var(--muted)',cursor:'pointer'}} onClick={()=>setRoleDurHours(r=>({...r,[st.key]:d.hours}))}>{d.label}</button>)}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:'0.5rem',color:'var(--muted)'}}>Start</span>
                  <input type="time" value={roleStartTimes[st.key]||startTime} onChange={e=>setRoleStartTimes(r=>({...r,[st.key]:e.target.value}))} style={{fontFamily:'var(--mono)',fontSize:'0.56rem',padding:'3px 6px',background:'var(--surface2)',border:'1px solid var(--border2)',color:'var(--text)',width:80}}/>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:'0.5rem',color:'var(--muted)'}}>Ende</span>
                  <input type="time" value={roleEndTimes[st.key]||endTime} onChange={e=>setRoleEndTimes(r=>({...r,[st.key]:e.target.value}))} style={{fontFamily:'var(--mono)',fontSize:'0.56rem',padding:'3px 6px',background:'var(--surface2)',border:'1px solid var(--border2)',color:'var(--text)',width:80}}/>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      :<div className="roles-check-grid">
        {ALL_SHIFT_TYPES.map(st=>(
          <div key={st.key} className={`role-check-item${enabledRoles[st.key]?' checked':''}`} onClick={()=>toggleRole(st.key)}>
            <div className="role-check-box">{enabledRoles[st.key]&&'✓'}</div>
            <span className="role-check-name">{st.label}</span>
            {enabledRoles[st.key]&&(
              <div style={{display:'flex',flexDirection:'column',gap:2,marginLeft:'auto',flexShrink:0}} onClick={e=>e.stopPropagation()}>
                <div className="role-count-wrap">
                  <button className="role-count-btn" onClick={()=>changeCount(st.key,-1)}>−</button>
                  <span className="role-count-num">{roleCounts[st.key]||st.defaultCount}</span>
                  <button className="role-count-btn" onClick={()=>changeCount(st.key,+1)}>+</button>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4,marginTop:2}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:'0.44rem',color:'var(--muted)',letterSpacing:'0.04em'}}>Blöcke</span>
                  <button className="role-count-btn" onClick={()=>changeRoleBlocks(st.key,-1)}>−</button>
                  <span className="role-count-num" style={{fontSize:'0.58rem',color:(roleBlocks[st.key]&&roleBlocks[st.key]<numBlocks)?'var(--gold)':'var(--dim)'}}>{roleBlocks[st.key]||numBlocks}</span>
                  <button className="role-count-btn" onClick={()=>changeRoleBlocks(st.key,+1)}>+</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>}
      <div className="sec-div">Eigene Rollen</div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {customRoles.map((cr,i)=>(
          <div key={cr.key} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',border:'1px solid var(--border)',background:'var(--surface2)'}}>
            <input value={cr.label} onChange={e=>{const r=[...customRoles];r[i]={...r[i],label:e.target.value};setCustomRoles(r);}} placeholder="Rollenname" style={{flex:1,fontFamily:'var(--mono)',fontSize:'0.82rem',background:'transparent',border:'1px solid var(--border2)',color:'var(--text)',padding:'6px 8px'}}/>
            <div className="role-count-wrap">
              <button className="role-count-btn" onClick={()=>{const r=[...customRoles];r[i]={...r[i],defaultCount:Math.max(1,(r[i].defaultCount||2)-1)};setCustomRoles(r);}}>&#8722;</button>
              <span className="role-count-num">{cr.defaultCount||2}</span>
              <button className="role-count-btn" onClick={()=>{const r=[...customRoles];r[i]={...r[i],defaultCount:Math.min(4,(r[i].defaultCount||2)+1)};setCustomRoles(r);}}>+</button>
            </div>
            <button className="btn sm red" onClick={()=>{const r=customRoles.filter((_,j)=>j!==i);setCustomRoles(r);const er={...enabledRoles};delete er[cr.key];setEnabledRoles(er);}}>&#10005;</button>
          </div>
        ))}
        <button className="btn sm" onClick={()=>{
          const key='custom_'+Date.now();
          setCustomRoles([...customRoles,{key,label:'',defaultCount:2}]);
          setEnabledRoles({...enabledRoles,[key]:true});
          setRoleCounts({...roleCounts,[key]:2});
        }} style={{alignSelf:'flex-start'}}>+ Rolle hinzufuegen</button>
      </div>
      {err&&<div style={{fontFamily:'var(--mono)',fontSize:'0.56rem',color:'var(--red)',marginTop:10}}>{err}</div>}
      <div className="form-actions">
        {onCancel&&<button className="btn" onClick={onCancel}>Abbrechen</button>}

// ── EXPORT PDF ──
function exportPDF(ev){
  const activeRoles=getEventRoles(ev).filter(st=>ev.enabledRoles[st.key]);
  const{full}=fmtDate(ev.date);
  // Group roles by their block set
  const groups=[];const seen={};
  activeRoles.forEach(st=>{
    const blks=getRoleBlocks(ev,st.key);
    const gk=blks.join('|');
    if(!seen[gk]){seen[gk]={blocks:blks,roles:[]};groups.push(seen[gk]);}
    seen[gk].roles.push(st);
  });
  let tables='';
  groups.forEach(g=>{
    let rows='';
    g.roles.forEach(st=>{
      const cnt=ev.roleCounts[st.key]||st.defaultCount;
      for(let si=0;si<cnt;si++){
        rows+=`<tr><td style="font-family:monospace;font-size:11px;color:#666;padding:7px 12px;border:1px solid #ddd;white-space:nowrap;background:#f9f9f9">${getRoleLabel(ev,st)}</td>
        ${g.blocks.map((_,bi)=>{const val=(ev.slots[`${st.key}_${bi}`]||[])[si]??null;
          return`<td style="padding:7px 12px;border:1px solid #ddd;text-align:center;font-size:13px;${val===null?'color:#ccc;background:#f5f5f5':val?'color:#2d7a35;font-weight:600':'color:#bbb'}">${val===null?'—':val||'·'}</td>`;}).join('')}</tr>`;
      }
    });
    tables+=`<table style="margin-bottom:16px"><thead><tr><th class="rc">Schicht</th>${g.blocks.map(b=>`<th>${b}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  const respRows=FIXED_ROLES.map(r=>`<tr><td style="font-family:monospace;font-size:11px;color:#666;padding:5px 12px;width:180px">${r}</td><td style="padding:5px 12px;font-size:13px;font-weight:${ev.fixedRoles[r]?600:400};color:${ev.fixedRoles[r]?'#111':'#bbb'}">${ev.fixedRoles[r]||'—'}</td></tr>`).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Spinnplan – ${ev.name}</title>
  <style>body{font-family:'Helvetica Neue',Arial,sans-serif;color:#111;padding:32px;max-width:900px;margin:0 auto;}
  h1{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
  .sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#999;margin-bottom:24px;font-family:monospace;}
  h2{font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#999;margin:20px 0 8px;border-bottom:1px solid #eee;padding-bottom:6px;}
  table{width:100%;border-collapse:collapse;}th{font-family:monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 12px;background:#111;color:#eee;text-align:center;}th.rc{text-align:left;}</style></head>
  <body><h1>${ev.name}</h1><div class="sub">Spinnplan · ${full} · ${ev.startTime} – ${ev.endTime}</div>
  <h2>Verantwortlichkeiten</h2><table><tbody>${respRows}</tbody></table>
  <h2>Schichten</h2>${tables}
  <div style="margin-top:32px;font-family:monospace;font-size:10px;color:#ccc;text-align:right;">Spinnplan · ${new Date().toLocaleDateString('de-CH')}</div></body></html>`;
  const win=window.open('','_blank');
  win.document.write(html+'<div style="position:fixed;top:16px;right:16px;"><button onclick="window.close()" style="font-family:monospace;font-size:11px;padding:8px 16px;background:#111;color:#fff;border:1px solid #333;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;">✕ Schliessen</button></div>');
  win.document.close();setTimeout(()=>win.print(),400);
}

// ── ADMIN PANEL ──
function AdminPanel({events,profile,setProfile:setProfileFn,onSlotChange,showToast,loadEvents,openModal,addNotif,deepLinkEventId}){
  const[tab,setTab]=useState('events');
  const[editing,setEditing]=useState(null);
  const[sendingReminder,setSendingReminder]=useState(null);

  async function sendShiftReminder(ev){
    const total=countSlots(ev),filled=countFilled(ev);
    const openSlots=total-filled;
    if(openSlots===0){showToast('Alle Schichten sind besetzt!','green');return;}
    if(!window.confirm(`Push-Notification senden?\n\n"${ev.name}" hat noch ${openSlots} offene Schichten.`))return;
    setSendingReminder(ev.id);
    const d=new Date(ev.date+'T12:00:00').toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
    const title=`${ev.name} – ${openSlots} offene Schichten`;
    const body=`Am ${d} hat es noch ${openSlots} offene Schichten. Wir wären super dankbar, wenn du eine Schicht übernehmen könntest!`;
    await addNotif('shift_reminder',title,body);
    try{
      await fetch('https://biyeggzutwajuueexcxl.supabase.co/functions/v1/notify-new-event',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${(await sb.auth.getSession()).data.session?.access_token}`},
        body:JSON.stringify({name:title,date:ev.date,start_time:ev.startTime,end_time:ev.endTime,type:'shift_reminder',body})
      });
    }catch(e){console.log('Push error:',e);}
    setSendingReminder(null);
    showToast('Erinnerung gesendet!','green');
  }

  async function saveEvent(ev){
    const isNew=!ev.id||typeof ev.id==='number';
    const dbRow=eventToDb(ev);
    let savedId=ev.id;
    if(isNew){
      delete dbRow.id;
      const{data,error}=await sb.from('events').insert(dbRow).select().single();
      if(error){showToast('Fehler: '+error.message,'red');return;}
      savedId=data.id;
    } else {
      const{error}=await sb.from('events').update(dbRow).eq('id',ev.id);
      if(error){showToast('Fehler: '+error.message,'red');return;}
    }
    // Build default slots in DB
    const slots=buildSlots({...ev,id:savedId});
    // Only upsert empty slots (don't overwrite existing)
    const existing=await sb.from('slots').select('slot_key,slot_index').eq('event_id',savedId);
    const existingSet=new Set((existing.data||[]).map(s=>`${s.slot_key}_${s.slot_index}`));
    const toInsert=[];
    Object.entries(slots).forEach(([key,arr])=>{
      arr.forEach((_,si)=>{if(!existingSet.has(`${key}_${si}`))toInsert.push({event_id:savedId,slot_key:key,slot_index:si,user_name:'',user_id:null});});
    });
    if(toInsert.length>0)await sb.from('slots').insert(toInsert);
    await loadEvents();
    setEditing(null);setTab('events');
    showToast(isNew?'Anlasse erstellt!':'Anlasse gespeichert','green');
    // Push notification for new event
    if(isNew){
      const d=new Date(ev.date+'T12:00:00').toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
      // Save to notifications table
      await addNotif('new_event', `Neuer Anlass: ${ev.name}`, `${d} · ${ev.startTime||ev.start_time||''}–${ev.endTime||ev.end_time||''}`);
      // Push via Edge Function (avoids CORS)
      try{
        await fetch('https://biyeggzutwajuueexcxl.supabase.co/functions/v1/notify-new-event',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${(await sb.auth.getSession()).data.session?.access_token}`},
          body:JSON.stringify({name:ev.name,date:ev.date,start_time:ev.startTime||ev.start_time,end_time:ev.endTime||ev.end_time})
        });
      }catch(e){console.log('Push error:',e);}

    }
  }

  async function deleteEvent(id){
    if(!window.confirm('Anlasse wirklich löschen?'))return;
    await sb.from('events').delete().eq('id',id);
    await loadEvents();
    showToast('Gelöscht','red');
  }

  if(editing)return(
    <><div className="nav"><button className="nav-tab active" onClick={()=>setEditing(null)}>← Zurück</button></div>
    <div className="main"><AdminCreateEvent existing={editing} onSave={saveEvent} onCancel={()=>setEditing(null)}/></div></>
  );

  return(
    <>
      <div className="nav">
        <button className={`nav-tab${tab==='events'?' active':''}`} onClick={()=>setTab('events')}>Anlässe</button>
        <button className={`nav-tab${tab==='create'?' active':''}`} onClick={()=>setTab('create')}>+ Neu</button>
        <button className={`nav-tab${tab==='mine'?' active':''}`} onClick={()=>setTab('mine')}>Meine Schichten</button>
      </div>
      <div className="main">
        {tab==='create'&&<AdminCreateEvent onSave={saveEvent}/>}
        {tab==='events'&&(
          <>
            <div className="page-top">
              <div><div className="page-eyebrow">Admin</div><h2 className="page-title">Anlässe</h2></div>
            </div>
            {(()=>{const upcoming=events.filter(ev=>!isEventPast(ev));
            return<>
            {upcoming.length===0&&<div className="empty-state"><div className="big">Keine Anlässe</div><p>Erstelle den ersten Anlasse oben.</p></div>}
            <div className="events-grid">
              {upcoming.map(ev=>(
                <div key={ev.id}>
                  <EventCard ev={ev} currentUser={profile} isAdmin={true} onSlotChange={onSlotChange} openModal={openModal} defaultOpen={ev.id===deepLinkEventId}/>
                  <div className="ev-admin-actions">
                    <button className="btn sm" onClick={()=>{navigator.clipboard.writeText(`${window.location.origin}?event=${ev.id}`);showToast('Link kopiert!','green');}}>🔗 Link</button>
                    {(countSlots(ev)-countFilled(ev))>0&&<button className="btn sm" style={{borderColor:'var(--gold)',color:'var(--gold)'}} onClick={()=>sendShiftReminder(ev)} disabled={sendingReminder===ev.id}>{sendingReminder===ev.id?'Senden…':'📢 Schichten gesucht'}</button>}
                    <button className="btn sm green" onClick={()=>exportPDF(ev)}>↓ PDF</button>
                    <button className="btn sm" onClick={()=>setEditing(ev)}>✎ Bearbeiten</button>
                    <button className="btn sm red" onClick={()=>deleteEvent(ev.id)}>✕ Löschen</button>
                  </div>
                </div>
              ))}
            </div></>})()}
          </>
        )}
        {tab==='mine'&&<MyShiftsView events={events} profile={profile} onSlotChange={onSlotChange} showToast={showToast}/>}
      </div>
    </>
  );
}

// ── MY SHIFTS VIEW (shared between user and admin) ──
function makeICS(shift){
  // Parse date + time range from shift
  const [y,m,d]=shift.date.split('-').map(Number);
  const [startStr,endStr]=shift.time.split(' – ');
  function toUTC(dateY,dateM,dateD,timeStr){
    const[h,min]=timeStr.split(':').map(Number);
    // Handle overnight (end < start means next day)
    const dt=new Date(dateY,dateM-1,dateD,h,min,0);
    return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  }
  const [sh,sm]=startStr.split(':').map(Number);
  const [eh,em]=endStr.split(':').map(Number);
  const startDt=new Date(y,m-1,d,sh,sm);
  const endDt=new Date(y,m-1,d,eh,em);
  if(eh<sh||(eh===sh&&em<sm))endDt.setDate(endDt.getDate()+1); // overnight
  function fmt(dt){return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
  const uid=`spinnplan-${shift.evId}-${shift.key}-${shift.si}@kulturspinnerei.ch`;
  const ics=[
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Spinnplan//Kulturspinnerei//DE',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(startDt)}`,
    `DTEND:${fmt(endDt)}`,
    `SUMMARY:${shift.role} – ${shift.evName}`,
    `DESCRIPTION:Schicht: ${shift.role}\nAnlass: ${shift.evName}\nZeit: ${shift.time}`,
    'LOCATION:Kulturspinnerei Bern',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`Spinnplan-${shift.evName.replace(/\s+/g,'-')}.ics`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function MyShiftsView({events,profile,onSlotChange,showToast}){
  const myShifts=useMemo(()=>findMyShifts(events,profile.name),[events,profile.name]);
  async function removeMyShift(evId,key,si){
    if(!window.confirm('Schicht abmelden?'))return;
    await onSlotChange(evId,key,si,'',null);
    showToast('Schicht abgemeldet','red');
  }
  function exportAllICS(){
    if(myShifts.length===0)return;
    // Build one ICS with all shifts
    const events_ics=myShifts.map(s=>{
      const[y,m,d]=s.date.split('-').map(Number);
      const[startStr,endStr]=s.time.split(' – ');
      const[sh,sm]=startStr.split(':').map(Number);
      const[eh,em]=endStr.split(':').map(Number);
      const startDt=new Date(y,m-1,d,sh,sm);
      const endDt=new Date(y,m-1,d,eh,em);
      if(eh<sh||(eh===sh&&em<sm))endDt.setDate(endDt.getDate()+1);
      function fmt(dt){return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
      return[
        'BEGIN:VEVENT',
        `UID:spinnplan-${s.evId}-${s.key}-${s.si}@kulturspinnerei.ch`,
        `DTSTART:${fmt(startDt)}`,
        `DTEND:${fmt(endDt)}`,
        `SUMMARY:${s.role} – ${s.evName}`,
        `DESCRIPTION:Schicht: ${s.role}\nAnlass: ${s.evName}\nZeit: ${s.time}`,
        'LOCATION:Kulturspinnerei Bern',
        'END:VEVENT'
      ].join('\r\n');
    }).join('\r\n');
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Spinnplan//Kulturspinnerei//DE',events_ics,'END:VCALENDAR'].join('\r\n');
    const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='Meine-Spinnplan-Schichten.ics';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    showToast('Kalender exportiert','green');
  }
  return(
    <>
      <div className="page-top">
        <div><div className="page-eyebrow">Übersicht</div><h2 className="page-title">Meine Schichten</h2></div>
        {myShifts.length>0&&<button className="btn white" onClick={exportAllICS}>📅 Alle exportieren</button>}
      </div>
      {myShifts.length===0
        ?<div className="empty-state"><div className="big">Noch keine Schichten</div><p>Trage dich bei einem Anlasse ein.</p></div>
        :<div className="my-shifts-list">
          {(()=>{
            // Group shifts by evId, sort each group by block start time
            const grouped={};
            myShifts.forEach(s=>{
              if(!grouped[s.evId])grouped[s.evId]={evName:s.evName,date:s.date,shifts:[]};
              grouped[s.evId].shifts.push(s);
            });
            // Sort shifts within each group by start time
            Object.values(grouped).forEach(g=>{
              g.shifts.sort((a,b)=>{
                const ta=a.time.split(' – ')[0]; // e.g. "21:00"
                const tb=b.time.split(' – ')[0];
                return ta.localeCompare(tb);
              });
            });
            return Object.values(grouped).map((g,gi)=>(
              <div key={gi} className="my-shift-group">
                <div className="my-shift-group-header">
                  <span className="my-shift-group-date">{fmtDate(g.date).full}</span>
                  <span className="my-shift-group-name">{g.evName}</span>
                  <button className="btn sm" onClick={()=>g.shifts.forEach(s=>makeICS(s))} style={{fontSize:'0.52rem',whiteSpace:'nowrap',marginLeft:'auto'}}>📅 Zum Kalender</button>
                </div>
                {g.shifts.map((s,si)=>(
                  <div key={si} className="my-shift-row">
                    <div className="my-shift-detail">
                      <span className="my-shift-role">{s.role}</span>
                      <span className="my-shift-time">{s.time}</span>
                    </div>
                    <button className="btn sm red" onClick={()=>removeMyShift(s.evId,s.key,s.si)}>Abmelden</button>
                  </div>
                ))}
              </div>
            ));
          })()}
        </div>
      }
    </>
  );
}

function ProfilePage({profile,setProfile,showToast}){
  const[name,setName]=useState(profile.name||'');
  const[email,setEmail]=useState(profile.email||'');
  const[pw,setPw]=useState('');
  const[pw2,setPw2]=useState('');
  const[saving,setSaving]=useState(false);

  async function saveName(){
    if(!name.trim()){return;}
    setSaving(true);
    await sb.from('profiles').update({name:name.trim()}).eq('id',profile.id);
    setProfile({...profile,name:name.trim()});
    showToast('Name gespeichert','green');
    setSaving(false);
  }

  async function saveEmail(){
    if(!email.trim())return;
    setSaving(true);
    const{error}=await sb.auth.updateUser({email:email.trim()});
    if(error){showToast('Fehler: '+error.message,'red');}
    else{setProfile({...profile,email:email.trim()});showToast('E-Mail aktualisiert – bitte bestätigen','blue');}
    setSaving(false);
  }

  async function savePassword(){
    if(pw.length<6){showToast('Min. 6 Zeichen','red');return;}
    if(pw!==pw2){showToast('Passwörter stimmen nicht überein','red');return;}
    setSaving(true);
    const{error}=await sb.auth.updateUser({password:pw});
    if(error){showToast('Fehler: '+error.message,'red');}
    else{showToast('Passwort geändert','green');setPw('');setPw2('');}
    setSaving(false);
  }

  return(
    <div className="main">
      <div className="page-top"><div><div className="page-eyebrow">Konto</div><h2 className="page-title">Profil</h2></div></div>
      <div className="admin-panel" style={{maxWidth:520}}>
        <div className="sec-div" style={{marginTop:0}}>Name</div>
        <div className="f-group" style={{marginBottom:12}}>
          <label className="f-label">Anzeigename</label>
          <input className="f-input" value={name} onChange={e=>setName(e.target.value)}/>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn white" onClick={saveName} disabled={saving}>Speichern</button>
        </div>

        <div className="sec-div">E-Mail</div>
        <div className="f-group" style={{marginBottom:12}}>
          <label className="f-label">E-Mail Adresse</label>
          <input className="f-input" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn white" onClick={saveEmail} disabled={saving}>Speichern</button>
        </div>

        <div className="sec-div">Passwort ändern</div>
        <div className="f-group" style={{marginBottom:8}}>
          <label className="f-label">Neues Passwort (min. 6 Zeichen)</label>
          <input className="f-input" type="password" value={pw} onChange={e=>setPw(e.target.value)}/>
        </div>
        <div className="f-group" style={{marginBottom:12}}>
          <label className="f-label">Passwort wiederholen</label>
          <input className="f-input" type="password" value={pw2} onChange={e=>setPw2(e.target.value)}/>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn white" onClick={savePassword} disabled={saving||!pw}>Passwort ändern</button>
        </div>

        <div className="sec-div" style={{marginTop:24,borderColor:'var(--red)',color:'var(--red)'}}>Konto löschen</div>
        <div style={{fontFamily:'var(--mono)',fontSize:'0.54rem',color:'var(--muted)',marginBottom:12,lineHeight:1.6}}>
          Dein Konto und alle deine Schicht-Einträge werden unwiderruflich gelöscht.
        </div>
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn red" onClick={async()=>{
            if(!window.confirm('Konto wirklich löschen? Dies kann nicht rückgängig gemacht werden.'))return;
            setSaving(true);
            await sb.from('profiles').delete().eq('id',profile.id);
            await sb.auth.admin?.deleteUser?.(profile.id);
            await sb.auth.signOut();
            window.location.reload();
          }} disabled={saving}>Konto löschen</button>
        </div>
      </div>
    </div>
  );
}

function NotificationsPanel({notifs,profile,onClose,onDismiss}){
  function timeAgo(ts){
    const d=Math.floor((Date.now()-new Date(ts).getTime())/1000);
    if(d<60)return 'Gerade eben';
    if(d<3600)return `vor ${Math.floor(d/60)} Min.`;
    if(d<86400)return `vor ${Math.floor(d/3600)} Std.`;
    return `vor ${Math.floor(d/86400)} Tagen`;
  }
  const icons={new_event:'📅',absence:'🚨',reminder:'⏰',admin_48h:'⚠️',shift_reminder:'📢'};
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:200}} onClick={onClose}>

        </div>
        <div style={{overflowY:'auto',flex:1}}>
          {(!notifs||notifs.length===0)
            ?<div style={{padding:24,fontFamily:'var(--mono)',fontSize:'0.55rem',color:'var(--muted)',textAlign:'center'}}>Keine Benachrichtigungen</div>
            :notifs.map((n,i)=>{

              return(

                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:'var(--mono)',fontSize:'0.6rem',fontWeight:700,color:unread?'#fff':'var(--dim)',marginBottom:2}}>{n.title}</div>
                    <div style={{fontFamily:'var(--mono)',fontSize:'0.52rem',color:'var(--muted)',marginBottom:4,lineHeight:1.4}}>{n.body}</div>
                    <div style={{fontFamily:'var(--mono)',fontSize:'0.45rem',color:'#444'}}>{timeAgo(n.created_at)}</div>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}}>
                    {unread&&<div style={{width:6,height:6,borderRadius:'50%',background:'var(--green)'}}/>}
                    <button onClick={()=>onDismiss(n.id)} style={{background:'transparent',border:'none',color:'#444',cursor:'pointer',fontSize:'0.7rem',padding:'2px 4px',lineHeight:1}} title="Schliessen">✕</button>
                  </div>
                </div>
              );
            })
          }
        </div>
      </div>
    </div>
  );
}

// ── PDF ATTACHMENT ──
function PdfAttachment({bucket,path,label,isAdmin}){
  const[url,setUrl]=useState(null);
  const[uploading,setUploading]=useState(false);
  const fileRef=React.useRef();

  useEffect(()=>{
    const{data}=sb.storage.from(bucket).getPublicUrl(path);
    // Check if file exists by trying to fetch headers
    fetch(data.publicUrl,{method:'HEAD'}).then(r=>{
      if(r.ok)setUrl(data.publicUrl);
    }).catch(()=>{});
  },[path]);

  async function upload(e){
    const file=e.target.files[0];
    if(!file)return;
    setUploading(true);
    const{error}=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:'application/pdf'});
    if(!error){
      const{data}=sb.storage.from(bucket).getPublicUrl(path);
      setUrl(data.publicUrl+'?t='+Date.now());
    }
    setUploading(false);
  }

  return(
    <div style={{marginTop:14,padding:'12px 14px',background:'#0a0a0a',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:'1rem'}}>📄</span>
        <span style={{fontFamily:'var(--mono)',fontSize:'0.58rem',color:'var(--dim)'}}>{label}</span>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        {url&&<a href={url} target="_blank" rel="noreferrer" style={{fontFamily:'var(--mono)',fontSize:'0.55rem',color:'var(--gold)',letterSpacing:'0.08em',textDecoration:'none',border:'1px solid var(--gold)',padding:'5px 10px'}}>Öffnen →</a>}
        {isAdmin&&<>
          <input ref={fileRef} type="file" accept="application/pdf" style={{display:'none'}} onChange={upload}/>
          <button className="btn sm" onClick={()=>fileRef.current.click()} disabled={uploading} style={{fontSize:'0.5rem'}}>
            {uploading?'…':url?'Ersetzen':'PDF hochladen'}
          </button>
        </>}
        {!url&&!isAdmin&&<span style={{fontFamily:'var(--mono)',fontSize:'0.52rem',color:'var(--muted)'}}>Noch kein PDF</span>}
      </div>
    </div>
  );
}

function AuthScreen({onLogin,onGuest}){

  const[pw,setPw]=useState('');

  async function doLogin(){
    setLoading(true);setErr('');
    const{data,error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    if(error){setErr('E-Mail oder Passwort falsch.');setLoading(false);return;}
    onLogin(data.session);
    setLoading(false);
  }

  async function doRegister(){
    if(!name.trim()||!email.trim()||pw.length<6){setErr('Alle Felder ausfüllen (min. 6 Zeichen).');return;}
    if(pw!==pw2){setErr('Passwörter stimmen nicht überein.');return;}

    setOk('Konto erstellt! Du kannst dich jetzt einloggen.');
    setTab('login');setLoading(false);
  }

  async function doReset(){
    if(!email.trim()){setErr('Bitte zuerst E-Mail eingeben.');return;}
    setLoading(true);setErr('');
    const{error}=await sb.auth.resetPasswordForEmail(email.trim(),{
      redirectTo:'https://spinnplan-23.netlify.app'
    });
    if(error){setErr(error.message);setLoading(false);return;}
    setOk('Reset-Link gesendet! Schau in dein Postfach.');
    setLoading(false);
  }

  return(
    <div className="auth-wrap">
      <div style={{marginBottom:28}}><Logo height={40}/></div>

        <div className="auth-eyebrow">Kulturspinnerei Bern</div>

          <button className={`auth-tab${tab==='register'?' active':''}`} onClick={()=>{setTab('register');setErr('');setOk('');}}>Registrieren</button>
        </div>
        {tab==='login'?(
          <>
            <div className="field"><label>E-Mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()} autoFocus/></div>
            <div className="field"><label>Passwort</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()}/></div>
            {err&&<div className="auth-err">{err}</div>}
            {ok&&<div className="auth-ok">{ok}</div>}
            <button className="btn-full primary" onClick={doLogin} disabled={loading}>{loading?'…':'Einloggen'}</button>
            <button onClick={doReset} disabled={loading} style={{marginTop:12,width:'100%',background:'transparent',border:'none',fontFamily:'var(--mono)',fontSize:'0.54rem',letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',cursor:'pointer',padding:'6px 0',textDecoration:'underline'}}>{loading?'…':'Passwort vergessen?'}</button>

              <div style={{flex:1,height:'1px',background:'var(--border)'}}/>
              <span style={{fontFamily:'var(--mono)',fontSize:'0.5rem',letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--muted)'}}>oder</span>
              <div style={{flex:1,height:'1px',background:'var(--border)'}}/>

        ):(
