function App(){
  const[session,setSession]=useState(null);
  const[profile,setProfile]=useState(null);
  const[events,setEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  const[modal,setModal]=useState(null);
  const[deepLinkEventId]=useState(()=>new URLSearchParams(window.location.search).get('event'));
  const[menuOpen,setMenuOpen]=useState(false);
  const[menuTab,setMenuTab]=useState(null);
  const[toast,setToast]=useState(null);
  const[guestName,setGuestName]=useState(null);
  const[showGuestScreen,setShowGuestScreen]=useState(false);
  const[notifs,setNotifs]=useState([]);
  const[notifsOpen,setNotifsOpen]=useState(false);
  const[isRecovery,setIsRecovery]=useState(()=>{
    const hash=window.location.hash;
    return hash.includes('type=recovery')||hash.includes('type=invite');
  });

  function showToast(msg,type='green'){setToast({msg,type,id:Date.now()});}
  function openModal(evId,key,si,role,time){setModal({evId,key,si,role,time});}

  // ── Load events + slots ──
  async function loadEvents(){
    const{data:evData}=await sb.from('events').select('*').order('date',{ascending:true});
    if(!evData)return;
    const{data:slotData}=await sb.from('slots').select('*');
    const slotsByEvent={};
    (slotData||[]).forEach(s=>{
      if(!slotsByEvent[s.event_id])slotsByEvent[s.event_id]=[];
      slotsByEvent[s.event_id].push(s);
    });
    setEvents(evData.map(ev=>dbToEvent(ev,slotsByEvent[ev.id]||[])));
  }

  // ── Auth state ──
  async function loadProfile(userId, email){
    const{data}=await sb.from('profiles').select('*').eq('id',userId).single();
    if(data){
      setProfile({...data,isAdmin:data.is_admin,email});

      await loadNotifs(userId, data.is_admin);

      // Subscribe to push notifications
      setTimeout(()=>subscribePush(userId),2000);

      return true;
    }
    return false;
  }

  async function loadNotifs(userId, isAdmin){
    const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);
    setNotifs(data||[]);
  }

  async function markNotifsRead(){
    if(!profile)return;
    const unread=(notifs||[]).filter(n=>!n.read_by?.includes(profile.id));
    if(!unread.length)return;
    for(const n of unread){
      const readBy=[...(n.read_by||[]),profile.id];
      await sb.from('notifications').update({read_by:readBy}).eq('id',n.id);
    }
    setNotifs(prev=>prev.map(n=>({...n,read_by:[...(n.read_by||[]),profile.id]})));
  }

  async function dismissNotif(id){
    if(!profile)return;
    const notif=notifs.find(n=>n.id===id);
    const readBy=[...(notif?.read_by||[]),profile.id];
    await sb.from('notifications').update({read_by:readBy}).eq('id',id);
    setNotifs(prev=>prev.map(n=>n.id===id?{...n,read_by:readBy}:n));
  }

  async function addNotif(type, title, body){
    console.log('addNotif called:', type, title, body);
    const{data,error}=await sb.from('notifications').insert({type,title,body,read_by:[]}).select();
    console.log('addNotif result:', data, error);
    if(error){console.log('addNotif error:',error);return;}
    const{data:all}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);
    setNotifs(all||[]);
  }



  useEffect(()=>{
    // Listen for auth state changes (token refresh, logout)
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,newSession)=>{
      if(event==='TOKEN_REFRESHED'&&newSession){
        setSession(newSession);
      }
      if(event==='SIGNED_OUT'){
        setSession(null);setProfile(null);setEvents([]);
      }
    });

    // Handle auth tokens in URL (password reset, invite)
    if(window.location.hash.includes('access_token')){
      sb.auth.getSession().then(async({data:{session}})=>{
        if(session){
          const type=window.location.hash.includes('type=recovery')||window.location.hash.includes('type=invite');
          if(type){setIsRecovery(true);setLoading(false);return;}
          setSession(session);
          await loadProfile(session.user.id, session.user.email);
          await loadEvents();
        }
        setLoading(false);
      }).catch(()=>setLoading(false));
      return ()=>subscription.unsubscribe();
    }
    sb.auth.getSession().then(async({data:{session}})=>{
      if(session){
        setSession(session);
        await loadProfile(session.user.id, session.user.email);
        await loadEvents();
      }
      setLoading(false);
    }).catch(()=>setLoading(false));
    return ()=>subscription.unsubscribe();
  },[]);

  // ── Realtime subscriptions ──
  useEffect(()=>{
    if(!session)return;
    const evSub=sb.channel('events-changes')
      .on('postgres_changes',{event:'*',schema:'public',table:'events'},()=>loadEvents())
      .on('postgres_changes',{event:'*',schema:'public',table:'slots'},payload=>{
        if(payload.eventType==='UPDATE'||payload.eventType==='INSERT'){
          const s=payload.new;
          setEvents(prev=>prev.map(ev=>{
            if(ev.id!==s.event_id)return ev;
            const slots={...ev.slots,[s.slot_key]:[...(ev.slots[s.slot_key]||[])]};
            slots[s.slot_key][s.slot_index]=s.user_name||'';
            return{...ev,slots};
          }));
        }
      })
      .subscribe();
    return()=>sb.removeChannel(evSub);
  },[session]);

  // ── Slot change handler ──
  async function onSlotChange(evId,key,si,userName,userId){
    setEvents(prev=>prev.map(ev=>{
      if(ev.id!==evId)return ev;
      const slots={...ev.slots,[key]:[...(ev.slots[key]||[])]};
      slots[key][si]=userName;
      return{...ev,slots};
    }));
    // Try update first, check if rows were affected, fallback to upsert
    const{data:upData,error:upErr}=await sb.from('slots')
      .update({user_name:userName||'',user_id:userId||null,updated_at:new Date().toISOString()})
      .eq('event_id',evId).eq('slot_key',key).eq('slot_index',si)
      .select();
    if(upErr||!upData||upData.length===0){
      // Fallback: upsert (handles both RLS-blocked updates and missing rows)
      const{error:inErr}=await sb.from('slots')
        .upsert({event_id:evId,slot_key:key,slot_index:si,user_name:userName||'',user_id:userId||null,updated_at:new Date().toISOString()},
          {onConflict:'event_id,slot_key,slot_index'});
      if(inErr){showToast('Fehler beim Speichern','red');console.error(inErr);await loadEvents();}
    }
  }

  async function confirmSignup(name){
    if(!name.trim()||!modal)return;
    // Check: same name already in a DIFFERENT role with OVERLAPPING time
    const ev=events.find(e=>e.id===modal.evId);
    if(ev){
      const currentRole=modal.key.split('_')[0];
      const currentBlockIdx=parseInt(modal.key.split('_')[1]);
      const blocks=getRoleBlocks(ev,currentRole);
      const currentTime=blocks[currentBlockIdx]; // e.g. "21:00 – 22:30"
      function parseBlock(t){const[s,e]=t.split(' – ');return[toMins(s),toMins(e)];}
      const[cs,ce]=parseBlock(currentTime);
      const conflict=Object.entries(ev.slots||{}).some(([key,arr])=>{
        const role=key.split('_')[0];
        if(role===currentRole)return false; // same role is fine
        const bi=parseInt(key.split('_')[1]);
        const otherBlocks=getRoleBlocks(ev,role);
        const blockTime=otherBlocks[bi];
        if(!blockTime)return false;
        const[bs,be]=parseBlock(blockTime);
        // Check overlap: two blocks overlap if one starts before the other ends
        const overlaps=cs<be&&bs<ce;
        if(!overlaps)return false;
        return arr.some(v=>v&&v.trim().toLowerCase()===name.trim().toLowerCase());
      });
      if(conflict){
        showToast(`${name.trim()} ist bereits in einer anderen Rolle zur gleichen Zeit eingetragen`,'red');
        return;
      }
    }
    await onSlotChange(modal.evId,modal.key,modal.si,name.trim(),guestName?null:profile?.id||null);
    setModal(null);
    showToast(`${name.trim()} eingetragen`,'green');
  }

  async function logout(){
    await sb.auth.signOut();
    setSession(null);setProfile(null);setEvents([]);
  }

    if(isRecovery)return<PasswordResetScreen/>;

  if(loading)return(
    <div className="loading-screen">
      <Logo height={36}/>
      <div className="loading-spinner"></div>
      <div className="loading-text">Verbinden…</div>
    </div>
  );

  if(!guestName&&(!session||!profile)){
    if(showGuestScreen) return<GuestScreen
      onGuest={(name)=>{setGuestName(name);setShowGuestScreen(false);loadEvents();}}
      onBack={()=>setShowGuestScreen(false)}
    />;
    return<AuthScreen onLogin={async(s)=>{
      if(!s)return;
      setSession(s);
      await loadProfile(s.user.id, s.user.email);
      await loadEvents();
    }} onGuest={()=>setShowGuestScreen(true)}/>;
  };

  return(
    <>
      <div className="header">
        <div className="header-left">
          <Logo height={64} spin={true}/><span style={{fontFamily:"var(--cond)",fontSize:"1.5rem",fontWeight:900,textTransform:"uppercase",letterSpacing:"0.14em",marginLeft:"12px",color:"var(--fg)"}}>Spinnplan</span>
        </div>
        <div className="header-right">
          {guestName
            ?<><span className="h-badge" style={{background:'#333'}}>Aushilfe</span>
              <button className="btn sm" style={{marginLeft:8,fontSize:'0.5rem'}} onClick={()=>{setGuestName(null);setEvents([]);}}>← Login</button></>
            :<>{profile.isAdmin&&<span className="h-badge">⚙ Admin</span>}
              {!guestName&&<button className="h-notif-btn" onClick={()=>{setNotifsOpen(o=>!o);if(!notifsOpen)markNotifsRead();}} aria-label="Notifications">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                {(notifs||[]).filter(n=>!n.read_by?.includes(profile?.id)).length>0&&
                  <span className="h-notif-badge">{(notifs||[]).filter(n=>!n.read_by?.includes(profile?.id)).length}</span>
                }
              </button>}
              <button className="h-menu-btn" onClick={()=>setMenuOpen(o=>!o)} aria-label="Menu">
                <span className="h-menu-icon">{menuOpen?'✕':'☰'}</span>
              </button></>
          }
        </div>
      </div>
      {menuOpen&&(
        <div className="h-dropdown" onClick={()=>setMenuOpen(false)}>
          <div className="h-dropdown-inner" onClick={e=>e.stopPropagation()}>
            <div className="h-dropdown-name">{profile.name}</div>
            {profile.isAdmin&&<div className="h-dropdown-role">⚙ Admin</div>}
            <div className="h-dropdown-divider"/>
            <button className="h-dropdown-item" onClick={()=>{setMenuOpen(false);setMenuTab('profil');}}>👤 Profil</button>
            <button className="h-dropdown-item" onClick={()=>{setMenuOpen(false);setMenuTab('notif');}}>🔔 Benachrichtigungen</button>
            <button className="h-dropdown-item" onClick={()=>{setMenuOpen(false);setMenuTab('guides');}}>📋 Anleitungen</button>
            <button className="h-dropdown-item" onClick={()=>{setMenuOpen(false);setMenuTab('archiv');}}>📦 Archiv</button>
            {profile.isAdmin&&<button className="h-dropdown-item" onClick={()=>{setMenuOpen(false);setMenuTab('users');}}>👥 User:innen</button>}
            <div className="h-dropdown-divider"/>
            <button className="h-dropdown-item red" onClick={()=>{setMenuOpen(false);logout();}}>→ Logout</button>
          </div>
        </div>
      )}

      {notifsOpen&&!guestName&&<NotificationsPanel notifs={notifs} profile={profile} onClose={()=>setNotifsOpen(false)} onDismiss={dismissNotif}/>}

      {menuTab==='profil'&&(
        <div className="main">
          <button className="btn" style={{marginBottom:16}} onClick={()=>setMenuTab(null)}>← Zurück</button>
          <ProfilePage profile={profile} setProfile={p=>setProfile(p)} showToast={showToast}/>
        </div>
      )}
      {menuTab==='notif'&&(
        <div className="main">
          <button className="btn" style={{marginBottom:16}} onClick={()=>setMenuTab(null)}>← Zurück</button>
          <NotifPage profile={profile} setProfile={p=>setProfile(p)} showToast={showToast}/>
        </div>
      )}
      {menuTab==='guides'&&(
        <div className="main">
          <button className="btn" style={{marginBottom:16}} onClick={()=>setMenuTab(null)}>← Zurück</button>
          <GuidesPage isAdmin={profile?.is_admin} showToast={showToast}/>
        </div>
      )}
      {menuTab==='archiv'&&(
        <div className="main">
          <button className="btn" style={{marginBottom:16}} onClick={()=>setMenuTab(null)}>← Zurück</button>
          <ArchivePage events={events} profile={profile} onSlotChange={onSlotChange} openModal={openModal}/>
        </div>
      )}
      {menuTab==='users'&&profile?.isAdmin&&(
        <div className="main">
          <button className="btn" style={{marginBottom:16}} onClick={()=>setMenuTab(null)}>← Zurück</button>
          <UsersPage showToast={showToast}/>
        </div>
      )}
      {!menuTab&&(guestName
        ?<GuestView events={events} guestName={guestName} onSlotChange={onSlotChange} openModal={openModal} showToast={showToast} deepLinkEventId={deepLinkEventId}/>
        :profile.is_admin
          ?<AdminPanel events={events} profile={profile} setProfile={p=>setProfile(p)} onSlotChange={onSlotChange} showToast={showToast} loadEvents={loadEvents} openModal={openModal} addNotif={addNotif} deepLinkEventId={deepLinkEventId}/>
          :<UserView events={events} profile={profile} setProfile={p=>{setProfile(p);}} onSlotChange={onSlotChange} openModal={openModal} showToast={showToast} deepLinkEventId={deepLinkEventId}/>
      )}

      <SignupModal modal={modal} profile={guestName?{name:guestName,isGuest:true}:profile} onConfirm={confirmSignup} onClose={()=>setModal(null)}/>
      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <InstallBanner/>
    </>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));

// Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
